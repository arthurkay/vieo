services:
  vieo:
    build:
      context: .
      dockerfile: Dockerfile
    image: vieo:latest
    container_name: vieo
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      VIEO_HTTP_ADDR: ":8080"
      VIEO_DB_PATH: "/app/data/vieo.db"
      VIEO_DATA_DIR: "/app/data"
      # VIEO_M3U_FILE: "/app/data/playlist.m3u"
      VIEO_MAX_JOBS: "3"
      VIEO_DISK_WARN: "90"
      VIEO_DISK_CRIT: "95"
      VIEO_WATERMARK: "true"
      VIEO_AUTH_ENABLED: "true"
    volumes:
      - vieo-data:/app/data
      # Mount an M3U playlist for the /browse feature (optional):
      # - ./playlist.m3u:/app/data/playlist.m3u:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vieo-data:
